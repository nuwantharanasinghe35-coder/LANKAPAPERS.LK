<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LankaPapers.LK - A/L & O/L Past Papers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Iskoola Pota', 'Noto Sans Sinhala', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #1a365d;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .paper-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .paper-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .tag {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .tag-al { background: #e3f2fd; color: #1976d2; }
        .tag-ol { background: #f3e5f5; color: #7b1fa2; }
        .tag-term { background: #e8f5e9; color: #388e3c; }
        .tag-past { background: #fff3e0; color: #f57c00; }
        .tag-model { background: #fce4ec; color: #c2185b; }
        .tag-si { background: #e0f2f1; color: #00796b; }
        .tag-en { background: #e8eaf6; color: #3f51b5; }
        .tag-ta { background: #fff8e1; color: #f9a825; }
        
        .paper-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 8px;
            flex-grow: 1;
        }
        
        .paper-desc {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        
        .views {
            font-size: 13px;
            color: #94a3b8;
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: all 0.2s;
        }
        
        .btn-view {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-view:hover {
            background: #e2e8f0;
        }
        
        .btn-download {
            background: #2563eb;
            color: white;
        }
        
        .btn-download:hover {
            background: #1d4ed8;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }
        
        .page-btn {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .page-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LankaPapers.LK</h1>
            <p>A/L & O/L Past Papers, Term Tests, Model Papers</p>
        </div>
        
        <div class="papers-grid" id="papersContainer">
            <!-- Cards JS walin generate wenawa -->
        </div>
        
        <div class="pagination">
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">5</button>
            <button class="page-btn">Next</button>
        </div>
    </div>

    <script>
        // MEKA THAMAI UBA EDIT KARANA THANAYA
        // Hara paper ekakata PDF file eke path eka danna
        const papersData = [
            {
                title: "විද්‍යාව සමාජාධ්‍යය 2024",
                type: "Commerce",
                exam: "A/L",
                paperType: "Term Test",
                province: "Southern",
                medium: "EN",
                views: "24,268",
                pdf: "lankapapers.lk/2024-Commerce-EN.pdf"
            },
            {
                title: "සිංහල 2024",
                type: "Languages",
                exam: "O/L",
                paperType: "Term Test",
                province: "Southern",
                medium: "SI",
                views: "24,261",
                pdf: "lankapapers.lk/2024-Sinhala-SI.pdf"
            },
            {
                title: "විද්‍යා 2024",
                type: "Science",
                exam: "O/L",
                paperType: "Past Paper",
                medium: "SI",
                views: "24,246",
                pdf: "lankapapers.lk/2024-Science-SI.pdf"
            },
            {
                title: "ඉස්ලාම් 2024",
                type: "Religion",
                exam: "O/L",
                paperType: "Past Paper",
                medium: "TA",
                views: "23,814",
                pdf: "lankapapers.lk/2024-Islam-TA.pdf"
            },
            {
                title: "ගිණුම්කරණය 2024 - Paper I",
                type: "Commerce",
                exam: "A/L",
                paperType: "Model Paper",
                medium: "TA",
                views: "23,675",
                pdf: "lankapapers.lk/2024-Accounting-P1-TA.pdf"
            },
            {
                title: "භෞතික විද්‍යාව 2024 - Paper II",
                type: "Science",
                exam: "A/L",
                paperType: "Past Paper",
                medium: "SI",
                views: "23,626",
                pdf: "lankapapers.lk/2024-Physics-P2-SI.pdf"
            },
            {
                title: "රසායන විද්‍යාව 2024",
                type: "Science",
                exam: "A/L",
                paperType: "Past Paper",
                medium: "SI",
                views: "23,054",
                pdf: "lankapapers.lk/2024-Chemistry-SI.pdf"
            },
            {
                title: "ආර්ථික විද්‍යාව 2024",
                type: "Commerce",
                exam: "A/L",
                paperType: "Past Paper",
                medium: "EN",
                views: "23,968",
                pdf: "lankapapers.lk/2024-Economics-EN.pdf"
            }
        ];

        // Cards generate karana function eka
        function renderPapers() {
            const container = document.getElementById('papersContainer');
            container.innerHTML = papersData.map(paper => `
                <div class="paper-card">
                    <div class="tags">
                        <span class="tag ${paper.exam === 'A/L' ? 'tag-al' : 'tag-ol'}">${paper.exam}</span>
                        <span class="tag ${paper.paperType === 'Term Test' ? 'tag-term' : paper.paperType === 'Past Paper' ? 'tag-past' : 'tag-model'}">${paper.paperType}</span>
                        ${paper.province ? <span class="tag">${paper.province}</span> : ''}
                        <span class="tag ${paper.medium === 'SI' ? 'tag-si' : paper.medium === 'EN' ? 'tag-en' : 'tag-ta'}">${paper.medium}</span>
                    </div>
                    <h3 class="paper-title">${paper.title}</h3>
                    <p class="paper-desc">${paper.type} • ${paper.paperType} • ✓ Marking</p>
                    <div class="card-footer">
                        <span class="views">${paper.views} බැලීම්</span>
                        <div class="btn-group">
                            <a href="${paper.pdf}" target="_blank" class="btn btn-view">පිළිතුරු</a>
                            <a href="${paper.pdf}" download class="btn btn-download">බාගන්න</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Page eka load weddi cards pennanna
        renderPapers();
    </script>
</body>
</html>
